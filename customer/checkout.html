<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pearl's Cafe - Checkout</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <h2>🍽️ Pearl's Cafe</h2>
        <div>
            <a href="menu.html">Menu</a>
            <a href="cart.html" class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">Checkout</h1>
        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-group">
                    <label>Order Type</label>
                    <select id="orderType" required>
                        <option value="collection">Collection</option>
                        <option value="delivery">Delivery</option>
                    </select>
                </div>
                <div class="form-group" id="addressGroup" style="display:none;">
                    <label>Delivery Address</label>
                    <textarea id="deliveryAddress" placeholder="Enter your delivery address"></textarea>
                </div>
                <div class="form-group">
                    <label>Order Summary</label>
                    <div id="orderSummary"></div>
                </div>
                <button type="submit" class="btn btn-primary">Place Order</button>
            </form>
        </div>
        <div id="message" class="message"></div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (!requireAuth()) window.location.href = '../index.html';

        const user = getCurrentUser();

        document.getElementById('orderType').addEventListener('change', function() {
            document.getElementById('addressGroup').style.display = this.value === 'delivery' ? 'block' : 'none';
        });

        function loadCartSummary() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const summary = document.getElementById('orderSummary');
            if (cart.length === 0) {
                summary.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }
            let total = 0;
            summary.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `<div>${item.name} x ${item.quantity} = R${itemTotal.toFixed(2)}</div>`;
            }).join('') + `<div style="font-weight:bold;margin-top:10px;">Total: R${total.toFixed(2)}</div>`;
            updateCartCount();
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const orderType = document.getElementById('orderType').value;
            const deliveryAddress = document.getElementById('deliveryAddress').value;
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const message = document.getElementById('message');

            if (cart.length === 0) {
                message.textContent = 'Your cart is empty!';
                message.className = 'message error';
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            try {
                const order = {
                    userId: user.id,
                    items: cart,
                    total: total,
                    status: 'pending',
                    type: orderType,
                    deliveryAddress: orderType === 'delivery' ? deliveryAddress : null,
                    createdAt: new Date().toISOString()
                };
                await createOrder(order);
                localStorage.removeItem('cart');

                message.textContent = '✅ Order placed successfully! Redirecting to track your order...';
                message.className = 'message success';

                setTimeout(() => {
                    window.location.href = 'track.html';
                }, 3000);

            } catch (error) {
                message.textContent = '❌ Order failed: ' + error.message;
                message.className = 'message error';
            }
        });

        loadCartSummary();
    </script>
</body>
</html>
