<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pearl's Kitchen - Feedback</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <h2>🍽️ Pearl's Kitchen</h2>
        <div>
            <a href="menu.html">Menu</a>
            <a href="cart.html" class="cart-btn">🛒 Cart (<span id="cartCount">0</span>)</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">Submit Feedback</h1>
        <div class="checkout-form">
            <form id="feedbackForm">
                <div class="form-group">
                    <label>Rating (1-5)</label>
                    <select id="rating" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comment</label>
                    <textarea id="comment" placeholder="Share your experience..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Feedback</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (!requireAuth()) window.location.href = '../index.html';

        const user = getCurrentUser();

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rating = parseInt(document.getElementById('rating').value);
            const comment = document.getElementById('comment').value;
            const message = document.getElementById('message');

            try {
                await createFeedback({
                    userId: user.id,
                    rating,
                    comment,
                    type: 'feedback',
                    createdAt: new Date().toISOString()
                });
                message.textContent = 'Thank you for your feedback!';
                message.className = 'message success';
                document.getElementById('feedbackForm').reset();
            } catch (error) {
                message.textContent = 'Failed to submit feedback: ' + error.message;
                message.className = 'message error';
            }
        });

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }
        updateCartCount();
    </script>
</body>
</html>
