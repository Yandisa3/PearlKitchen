<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's Cafe - Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }

        .login-box .logo-icon {
            font-size: 2.5em;
            text-align: center;
            display: block;
            margin-bottom: 5px;
        }

        .login-box h1 {
            font-size: 1.8em;
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 5px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #555;
            font-size: 0.95em;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .login-box .description {
            text-align: center;
            color: #777;
            font-size: 0.9em;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1.1em;
            transition: all 0.3s;
            pointer-events: none;
        }

        .form-group .input-wrapper input,
        .form-group .input-wrapper select {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
            color: #1a1a1a;
        }

        .form-group .input-wrapper input:focus,
        .form-group .input-wrapper select:focus {
            outline: none;
            border-color: #dc3545;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-group .input-wrapper input:focus + i,
        .form-group .input-wrapper input:focus ~ i {
            color: #dc3545;
        }

        .form-group .input-wrapper input::placeholder {
            color: #aaa;
        }

        .form-group .input-wrapper select {
            appearance: none;
            cursor: pointer;
            padding-right: 40px;
        }

        .form-group .input-wrapper select + i {
            pointer-events: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 53, 69, 0.4);
            background: #c82333;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 0.95em;
        }

        .login-link a {
            color: #dc3545;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: #c82333;
        }

        .message {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
            font-size: 0.95em;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 35px 25px 30px;
            }
            .login-box h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <span class="logo-icon">🍽️</span>
            <h1>Pearl's Cafe</h1>
            <p class="subtitle">Create Your Account</p>
            <p class="description">Join us and enjoy the best food of your dreams.</p>

            <form id="registerForm">
                
                <div class="form-group">
                    <label>First Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                
                <div class="form-group">
                    <label>Last Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="lastName" placeholder="Enter your last name" required>
                        <i class="fas fa-user-tag"></i>
                    </div>
                </div>

                
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Minimum 6 characters" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                
                <div class="form-group">
                    <label>Phone</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                        <i class="fas fa-phone"></i>
                    </div>
                </div>

                
                <div class="form-group">
                    <label>Role</label>
                    <div class="input-wrapper">
                        <select id="role">
                            <option value="customer">Customer</option>
                            <option value="employee">Employee</option>
                            <option value="driver">Driver</option>
                            <option value="owner">Owner</option>
                        </select>
                        <i class="fas fa-user-tie"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Register Now</button>
            </form>

            <p class="login-link">
                Already have an account? <a href="index.html">Login here</a>
            </p>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const message = document.getElementById('message');
            try {
                if (password.length < 6) throw new Error('Password must be at least 6 characters');
                await register({ firstName, lastName, email, password, phone, role });
                message.textContent = 'Registration successful! Redirecting...';
                message.className = 'message success';
                setTimeout(redirectBasedOnRole, 1500);
            } catch (error) {
                message.textContent = error.message;
                message.className = 'message error';
            }
        });
    </script>
</body>
</html>
