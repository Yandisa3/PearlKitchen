<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's Cafe - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }

        .login-box .logo-icon {
            font-size: 2.5em;
            text-align: center;
            display: block;
            margin-bottom: 5px;
        }

        .login-box h1 {
            font-size: 2em;
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 5px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #555;
            font-size: 0.95em;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .login-box .description {
            text-align: center;
            color: #777;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1.1em;
            transition: all 0.3s;
            pointer-events: none;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
            color: #1a1a1a;
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: #dc3545;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-group .input-wrapper input:focus + i {
            color: #dc3545;
        }

        .form-group .input-wrapper input::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-black {
            background: #1a1a1a;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-black:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            background: #000000;
        }

        .btn-black:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.2);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background: #5a6268;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 0.95em;
        }

        .login-link a {
            color: #dc3545;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: #c82333;
        }

        .message {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
            font-size: 0.95em;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 35px 25px 30px;
            }
            .login-box h1 {
                font-size: 1.7em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <span class="logo-icon">🔑</span>
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password</p>
            <p class="description">Please choose a strong password.</p>

            <div id="tokenError" class="message error" style="display:block;">
                ⚠️ Invalid or missing reset token. Please request a new reset link.
            </div>

            <form id="resetForm" style="display:none;">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-black">Reset Password</button>
            </form>

            <div id="message" class="message"></div>

            <p class="login-link">
                <a href="index.html">← Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const tokenError = document.getElementById('tokenError');
            const resetForm = document.getElementById('resetForm');
            const message = document.getElementById('message');

            if (!token) {
                tokenError.style.display = 'block';
                tokenError.textContent = '⚠️ No reset token provided. Please request a new reset link.';
                return;
            }

            // Verify token with database
            try {
                const user = await findUserByResetToken(token);
                if (!user) {
                    tokenError.style.display = 'block';
                    tokenError.textContent = '❌ Invalid reset token. It may have expired or been used. Please request a new reset link.';
                    return;
                }
                // Token is valid, show the form
                tokenError.style.display = 'none';
                resetForm.style.display = 'block';

                // Store email for later use
                const userEmail = user.email;

                // Handle form submission
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    if (newPassword.length < 6) {
                        message.textContent = 'Password must be at least 6 characters.';
                        message.className = 'message error';
                        return;
                    }

                    if (newPassword !== confirmPassword) {
                        message.textContent = 'Passwords do not match.';
                        message.className = 'message error';
                        return;
                    }

                    try {
                        // Update user password and clear token
                        await updateUserPassword(userEmail, newPassword);
                        message.textContent = '✅ Password reset successful! You can now login with your new password.';
                        message.className = 'message success';

                        // Clear the form
                        resetForm.reset();

                        // After 3 seconds, redirect to login
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 3000);

                    } catch (error) {
                        message.textContent = '❌ Error: ' + error.message;
                        message.className = 'message error';
                    }
                });

            } catch (error) {
                tokenError.style.display = 'block';
                tokenError.textContent = '❌ Error verifying token: ' + error.message;
                console.error(error);
            }
        })();
    </script>
</body>
</html>
