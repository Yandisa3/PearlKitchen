<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's Cafe - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 40px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }

        .login-box .logo-icon {
            font-size: 2.5em;
            text-align: center;
            display: block;
            margin-bottom: 5px;
        }

        .login-box h1 {
            font-size: 2em;
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 5px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #555;
            font-size: 0.95em;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .login-box .description {
            text-align: center;
            color: #777;
            font-size: 0.9em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 1.1em;
            transition: all 0.3s;
            pointer-events: none;
        }

        .form-group .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #fafafa;
            color: #1a1a1a;
        }

        .form-group .input-wrapper input:focus {
            outline: none;
            border-color: #dc3545;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-group .input-wrapper input:focus + i {
            color: #dc3545;
        }

        .form-group .input-wrapper input::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ⬇️ BLACK BUTTON with white text */
        .btn-black {
            background: #1a1a1a;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-black:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            background: #000000;
        }

        .btn-black:active {
            transform: scale(0.98);
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
            font-size: 0.9em;
        }

        .forgot-password a {
            color: #888;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .forgot-password a:hover {
            color: #dc3545;
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 0.95em;
        }

        .register-link a {
            color: #dc3545;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: #c82333;
        }

        .message {
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
            font-size: 0.95em;
        }

        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .demo-credentials {
            background: #f8f9fa;
            padding: 18px 20px;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 0.85em;
            border: 1px solid #e8e8e8;
            text-align: center;
            color: #333;
        }

        .demo-credentials strong {
            color: #1a1a1a;
        }

        .demo-credentials .cred-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .demo-credentials .cred-item {
            background: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #555;
            border: 1px solid #e8e8e8;
        }

        .demo-credentials .cred-item strong {
            color: #dc3545;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 35px 25px 30px;
            }
            .login-box h1 {
                font-size: 1.7em;
            }
            .demo-credentials .cred-row {
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <span class="logo-icon">🍽️</span>
            <h1>Pearl's Cafe</h1>
            <p class="subtitle">Welcome Back!</p>
            <p class="description">Please sign in to continue.</p>

            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <!-- Login Button (BLACK) -->
                <button type="submit" class="btn btn-black">Sign In</button>
            </form>

            <p class="register-link">
                Don't have an account? <a href="register.html">Create Account</a>
            </p>

            <div id="message" class="message"></div>

            <div class="demo-credentials">
                <strong>Demo Credentials</strong>
                <div class="cred-row">
                    <span class="cred-item"><strong>Customer:</strong> john@test.com / password123</span>
                    <span class="cred-item"><strong>Owner:</strong> owner@test.com / password123</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            try {
                await login(email, password);
                message.textContent = 'Login successful! Redirecting...';
                message.className = 'message success';
                setTimeout(redirectBasedOnRole, 1000);
            } catch (error) {
                message.textContent = error.message;
                message.className = 'message error';
            }
        });
    </script>
</body>
</html>
