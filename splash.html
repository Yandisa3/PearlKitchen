<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl's Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: #0d0d0d; /* Dark base */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .splash-container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .splash-box {
            background: #1a1a1a; /* Dark card */
            border-radius: 30px;
            padding: 50px 35px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-box .logo-icon {
            font-size: 4em;
            display: block;
            margin-bottom: 5px;
        }

        .splash-box .welcome-text {
            font-size: 0.9em;
            color: #aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .splash-box h1 {
            font-size: 2.8em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .splash-box h1 span {
            color: #ff6b6b; /* red accent */
        }

        .splash-box .tagline {
            color: #ccc;
            font-size: 1.1em;
            line-height: 1.6;
            margin: 15px 0 30px;
        }

        .splash-box .btn-splash {
            display: inline-block;
            padding: 16px 50px;
            background: #dc3545; /* red */
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 8px 30px rgba(220, 53, 69, 0.4);
            width: 100%;
        }

        .splash-box .btn-splash:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(220, 53, 69, 0.6);
            background: #c82333;
        }

        .splash-box .food-icons {
            margin-top: 25px;
            font-size: 1.8em;
            letter-spacing: 12px;
            color: #555;
        }

        .splash-box .version {
            margin-top: 20px;
            font-size: 0.75em;
            color: #555;
        }

        @media (max-width: 480px) {
            .splash-box {
                padding: 35px 25px 30px;
            }
            .splash-box h1 {
                font-size: 2.2em;
            }
            .splash-box .tagline {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-box">
            <span class="logo-icon">🍽️</span>
            <p class="welcome-text">Welcome to</p>
            <h1>Pearl's <span>Cafe</span></h1>
            <p class="tagline">
                Delicious food,<br>
                Great service, delivered<br>
                to your door.
            </p>

            <a href="index.html" class="btn-splash">Get Started 🚀</a>

            <div class="food-icons">
                🍔 🌯 🍕
            </div>
            <div class="version">v1.0</div>
        </div>
    </div>
</body>
</html>
